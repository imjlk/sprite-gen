<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파츠 제작 검수</title>
<link rel="stylesheet" href="/review.css">
<header><h1>파츠 제작 검수</h1><select id="part" aria-label="파츠"></select><span id="access"></span></header>
<main>
<section class="workspace">
 <div class="toolbar">
  <select id="filter" aria-label="포즈 필터"><option value="all">전체 포즈</option><option value="error">검사 오류</option><option value="unverified">미승인</option></select>
  <select id="view" aria-label="포즈 보기"><option value="body">몸 위 레이어</option><option value="part">독립 원본 파츠</option><option value="visible">가림 적용 파츠</option><option value="reference">생성 참조</option><option value="interfaces">검사 영역</option><option value="errors">오류 위치</option><option value="drawn">생성 원본 칸</option></select>
 </div>
 <p id="summary" class="muted"></p><p id="view-note" class="muted"></p>
 <div id="grid" class="grid"></div>
 <div class="toolbar actions"><button data-act="sheet">실패·반려·누락 포즈 시트</button><button data-act="draw">최신 시트 생성</button><button data-act="slice">생성물 분리</button><button data-act="check">전체 검사</button><button data-act="build">레이어 빌드</button></div>
 <a id="reference-download" hidden>최신 생성 기준 묶음 ↓</a>
 <details><summary>작업 기록</summary><pre id="log"></pre></details>
</section>
<aside id="inspector">
 <h2 id="pose-title">포즈를 선택하세요</h2><p id="pose-status" class="muted"></p>
 <div class="comparison"><figure><img id="reference-image" alt="이 후보가 생성될 때 사용한 참조"><figcaption>생성 당시 참조</figcaption></figure><figure><img id="part-image" alt="선택한 후보의 독립 원본 파츠"><figcaption>독립 원본 파츠</figcaption></figure></div>
 <p class="muted">녹색: 덮어야 할 곳 · 빨강: 보호 · 파랑: 허용 · 보라: 앞에서 가림</p>
 <ul id="findings"></ul><div id="candidates" class="candidates"></div>
 <button id="select-candidate">이 후보를 사용</button><p id="candidate-note" class="muted"></p>
 <details><summary>포즈·배치·생성 출처</summary><pre id="evidence"></pre></details>
 <div class="review-actions"><input id="reviewer" aria-label="검수자" placeholder="검수자"><textarea id="note" aria-label="검수 사유" placeholder="이 포즈의 검수·재작업 사유"></textarea><div class="toolbar"><button id="approve">현재 파츠 승인</button><button id="reject">현재 파츠 반려</button></div><button id="redo">이 포즈 재작업 시트</button></div>
 <p class="muted">검사 통과는 시각 승인이 아닙니다. 승인·반려는 현재 빌드에 저장됩니다.</p>
</aside>
</main>
<script src="/review.js"></script>
</html>
